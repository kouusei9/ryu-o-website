<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブースについて</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="booth_styles.css">
</head>
<body>
    <nav class="booth-nav">
        <div class="booth-nav-logo">
            <img src="img/logo.png" alt="logo">
        </div>
        <ul>
            <li><a href="index.html">ホーム</a></li>
            <li><a href="booth.html">ブース</a></li>
        </ul>
    </nav>

    <section class="booth-section">
        <div class="booth-content-box">
            <h2>ブースについて</h2>
            <p class="booth-lead">当日の様子や作成の様子を紹介します</p>

            <div class="booth-gallery">
                <div class="booth-card">
                    <img src="img/sakusei.jpg" alt="当日に向けて作成中">
                    <div class="booth-card-caption">将棋の駒を作成中</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide2.jpg" alt="レイアウト・寸法">
                    <div class="booth-card-caption">レイアウト・寸法</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide3.jpg" alt="模型と設置イメージ">
                    <div class="booth-card-caption">模型と設置イメージ</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide4.jpg" alt="資材・機材一覧">
                    <div class="booth-card-caption">資材・機材一覧</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide5.jpg" alt="見積もり（概算）">
                    <div class="booth-card-caption">見積もり（概算）</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide6.jpg" alt="当日の様子（写真）">
                    <div class="booth-card-caption">当日の様子（写真）</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide7.jpg" alt="追加写真1">
                    <div class="booth-card-caption">追加写真1</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide8.jpg" alt="追加写真2">
                    <div class="booth-card-caption">追加写真2</div>
                </div>

                <div class="booth-card">
                    <img src="img/slide9.jpg" alt="作業記録とメモ">
                    <div class="booth-card-caption">作業記録とメモ</div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
