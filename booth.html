<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブースについて</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="booth_styles.css">
</head>
<body>
    <nav class="booth-nav">
        <div class="booth-nav-logo">
            <img src="img/logo.png" alt="logo">
        </div>
        <ul>
            <li><a href="index.html">ホーム</a></li>
            <li><a href="booth.html">ブース</a></li>
        </ul>
    </nav>

    <section class="booth-section">
        <div class="booth-content-box">
            <h2>ブースについて</h2>
            <p class="booth-lead">当日の様子や作成の様子を紹介します</p>

            <div class="booth-gallery">
                <div class="booth-card">
                    <img src="booth_img/1st_image.jpg" alt="当初のイメージ図">
                    <div class="booth-card-caption">最初のブースのイメージ案</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/last_image.png" alt="完成したブースのイメージ図">
                    <div class="booth-card-caption">完成したブースのイメージ案</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/sakusei1.jpg" alt="将棋の駒を作成中">
                    <div class="booth-card-caption">ブースに飾り付ける将棋の駒を作成中</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/honnban_sakusei.jpg" alt="現地での設営作業">
                    <div class="booth-card-caption">現地での設営作業中</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/honnban_sakusei2.jpg" alt="現地での設営作業２">
                    <div class="booth-card-caption">現地での設営作業</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/honnban_sakusei3.jpg" alt="現地での設営作業３">
                    <div class="booth-card-caption">現地での設営作業</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/honnban_sakusei4.jpg" alt="現地での設営作業４">
                    <div class="booth-card-caption">現地での設営作業</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/kannsei_image.jpg" alt="ブース完成写真">
                    <div class="booth-card-caption">ブース完成！</div>
                </div>

                <div class="booth-card">
                    <img src="booth_img/tennzi_ue.jpg" alt="ブース上部の写真">
                    <div class="booth-card-caption">ブース上部の写真</div>
                </div>
                <div class="booth-card">
                    <img src="booth_img/tennzi_yoko.jpg" alt="ブースの横からの写真">
                    <div class="booth-card-caption">ブースを横から</div>
                </div>
                <div class="booth-card">
                    <img src="booth_img/touzitu_1.JPG" alt="当日の様子写真">
                    <div class="booth-card-caption">当日の様子1</div>
                </div>
                <div class="booth-card">
                    <img src="booth_img/touzitu_2.JPG" alt="当日の様子２">
                    <div class="booth-card-caption">当日の様子2</div>
                </div>
                <div class="booth-card">
                    <img src="booth_img/touzitu_3.JPG" alt="当日の様子３">
                    <div class="booth-card-caption">当日の様子3</div>
                </div>
                <div class="booth-card">
                    <img src="booth_img/touzitu_4.JPG" alt="当日の様子４">
                    <div class="booth-card-caption">当日の様子4</div>
                </div>
                <div class="booth-card">
                    <img src="booth_img/touzitu_5.JPG" alt="当日の様子５">
                    <div class="booth-card-caption">当日の様子5</div>
                </div>
                

            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
